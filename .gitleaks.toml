title = "nixkeyforge gitleaks configuration"

[extend]
useDefault = true

[[rules]]
id = "assigned-sensitive-variable"
description = "Sensitive variable assigned a literal value"
regex = '''(?i)(?:\b|_)(?:api_?key|apikey|access_?key|secret_?key|client_?secret|db_?pass(?:word)?|database_?password|postgres_?password|auth_?token|bearer_?token|private_?key|password|passwd|pwd|token)\s*[:=]\s*["']([^"'$%<{\r\n][^"'\r\n]{3,})["']'''
secretGroup = 1
keywords = ["api", "key", "secret", "pass", "pwd", "token"]

  [[rules.allowlists]]
  description = "Documented placeholder in the Secret Hygiene example only"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^YOUR_API_KEY_HERE$''']
  paths = ['''(^|/)SECURITY\.md$''']

  [[rules.allowlists]]
  description = "Synthetic scanner self-test value in its dedicated temporary path only"
  condition = "AND"
  regexTarget = "secret"
  regexes = ['''^TestOnly-NotARealSecret$''']
  paths = ['''(^|/)tests/gitleaks/allowed-db-password\.env$''']

[[rules]]
id = "credentialed-connection-string"
description = "Connection string containing inline credentials"
regex = '''(?i)(?:database_?url|connection_?string)\s*[:=]\s*["']([^"'\r\n]*://[^"'\r\n]*:[^"'\r\n]*@[^"'\r\n]+)["']'''
secretGroup = 1
keywords = ["database", "connection"]

[[allowlists]]
description = "Exclude generated build metadata"
paths = [
  '''(^|/)\.git/''',
  '''(^|/)\.direnv/''',
  '''(^|/)result/''',
  '''(^|/)target/''',
]
